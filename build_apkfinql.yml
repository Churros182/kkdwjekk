name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Crear archivos del proyecto
      run: |
          mkdir -p "$(dirname settings.gradle.kts)"
          cat > settings.gradle.kts <<'MAZDA_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MazdaVBFFlasher"
          include(":app")
          MAZDA_EOF
          mkdir -p "$(dirname build.gradle.kts)"
          cat > build.gradle.kts <<'MAZDA_EOF'
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
              id("com.chaquo.python") version "15.0.1" apply false
          }
          MAZDA_EOF
          mkdir -p "$(dirname gradle.properties)"
          cat > gradle.properties <<'MAZDA_EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          MAZDA_EOF
          mkdir -p "$(dirname app/build.gradle.kts)"
          cat > app/build.gradle.kts <<'MAZDA_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.chaquo.python")
          }

          android {
              namespace = "com.mikarro.mazdavbfflasher"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.mikarro.mazdavbfflasher"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"

                  ndk {
                      abiFilters += listOf("arm64-v8a", "armeabi-v7a")
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          chaquopy {
              defaultConfig {
                  version = "3.11"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
              implementation("com.google.android.material:material:1.11.0")
              implementation("androidx.constraintlayout:constraintlayout:2.1.4")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          MAZDA_EOF
          mkdir -p "$(dirname app/proguard-rules.pro)"
          cat > app/proguard-rules.pro <<'MAZDA_EOF'
          # Add project specific ProGuard rules here.
          MAZDA_EOF
          mkdir -p "$(dirname app/src/main/AndroidManifest.xml)"
          cat > app/src/main/AndroidManifest.xml <<'MAZDA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:label="Mazda VBF Flasher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          MAZDA_EOF
          mkdir -p "$(dirname app/src/main/res/layout/activity_main.xml)"
          cat > app/src/main/res/layout/activity_main.xml <<'MAZDA_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#121212"
              android:fillViewport="true">

          <LinearLayout
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:padding="16dp">

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="Mazda Calibration Files Android"
                  android:textColor="#00FFCC"
                  android:textSize="18sp"
                  android:textStyle="bold"
                  android:gravity="center"
                  android:paddingBottom="8dp"/>

              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="1. Enlace directo SharePoint (.vbf)"
                  android:textColor="#FFFFFF"
                  android:textSize="12sp"/>

              <EditText
                  android:id="@+id/etShareLink"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
