                  android:paddingTop="8dp"/>

              <ScrollView
                  android:id="@+id/svConsole"
                  android:layout_width="match_parent"
                  android:layout_height="260dp"
                  android:nestedScrollingEnabled="true"
                  android:background="#000000"
