                  <TextView
                      android:id="@+id/tvConsole"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:text="[Sistema] App lista.
          "
                      android:textColor="#00FF00"
                      android:fontFamily="monospace"
                      android:textIsSelectable="true"
                      android:textSize="11sp"/>
              </ScrollView>

          </LinearLayout>
          </ScrollView>
          MAZDA_EOF
          mkdir -p "$(dirname app/src/main/java/com/mikarro/mazdavbfflasher/MainActivity.kt)"
          cat > app/src/main/java/com/mikarro/mazdavbfflasher/MainActivity.kt <<'MAZDA_EOF'
          package com.mikarro.mazdavbfflasher

          import android.net.Uri
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.view.View
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import java.io.File

          class MainActivity : AppCompatActivity() {

              private lateinit var downloader: OneDriveDownloader
              private lateinit var etShareLink: EditText
              private lateinit var etFileName: EditText
              private lateinit var etVin: EditText
              private lateinit var btnDownload: Button
              private lateinit var btnBuscarVin: Button
              private lateinit var btnImportar: Button
              private lateinit var btnInfoArchivo: Button
              private lateinit var lvLocalFiles: ListView
              private lateinit var btnConnectOBD: Button
              private lateinit var btnFlashUDS: Button
              private lateinit var tvConsole: TextView
              private lateinit var svConsole: ScrollView

              private var archivoSeleccionado: File? = null
              private var adaptadorConectado = false
              private var ultimoVehiculo: String? = null

              private val selectorArchivo = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
                  if (uri != null) importarArchivo(uri)
              }

              private val carpetaCalibraciones: File
                  get() = File(filesDir, "CalibrationFiles")

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  downloader = OneDriveDownloader(this)

                  etShareLink = findViewById(R.id.etShareLink)
                  etFileName = findViewById(R.id.etFileName)
                  etVin = findViewById(R.id.etVin)
                  btnDownload = findViewById(R.id.btnDownload)
                  btnBuscarVin = findViewById(R.id.btnBuscarVin)
                  btnImportar = findViewById(R.id.btnImportar)
                  btnInfoArchivo = findViewById(R.id.btnInfoArchivo)
                  lvLocalFiles = findViewById(R.id.lvLocalFiles)
                  btnConnectOBD = findViewById(R.id.btnConnectOBD)
                  btnFlashUDS = findViewById(R.id.btnFlashUDS)
                  tvConsole = findViewById(R.id.tvConsole)
                  svConsole = findViewById(R.id.svConsole)

                  etShareLink.setText("https://mazdasa-my.sharepoint.com/:f:/g/personal/technical_onemazda_co_za/ElsPqMflhxJBgchQVUSHJ8QBsml0jPxPxyR_GKu-xWARPQ?e=gwAVtU")

                  actualizarListaLocal()

                  btnDownload.setOnClickListener {
                      val url = etShareLink.text.toString().trim()
                      var nombre = etFileName.text.toString().trim()
                      if (url.isEmpty()) {
                          logConsole("⚠️ Introduce un enlace válido.")
                          return@setOnClickListener
                      }
                      if (nombre.isEmpty()) {
                          nombre = "calibracion_${System.currentTimeMillis()}.vbf"
                      } else if (!nombre.endsWith(".vbf", ignoreCase = true)) {
                          nombre += ".vbf"
                      }

                      logConsole("🔄 Descargando $nombre desde SharePoint...")
                      CoroutineScope(Dispatchers.IO).launch {
                          val archivoDescargado = downloader.descargarVbf(url, nombre)
                          val hayArchivo = archivoDescargado != null && archivoDescargado.length() > 0
                          val esHtml = hayArchivo && archivoDescargado!!.inputStream().use { it.read() } == '<'.code
                          val esZip = hayArchivo && !esHtml && ZipUtil.esZip(archivoDescargado!!)
                          var extraidos: List<File> = emptyList()

                          if (esHtml) {
                              archivoDescargado?.delete()
                          } else if (esZip) {
                              extraidos = try {
                                  val temporal = File(cacheDir, "descarga.zip")
                                  archivoDescargado!!.copyTo(temporal, overwrite = true)
                                  archivoDescargado.delete()
                                  val resultado = ZipUtil.extraerVbf(temporal, carpetaCalibraciones)
                                  temporal.delete()
                                  resultado
                              } catch (e: Exception) {
                                  emptyList()
                              }
                          }

                          withContext(Dispatchers.Main) {
                              if (esHtml) {
                                  logConsole("❌ El enlace devolvió una página web, no un VBF (pide iniciar sesión). Usa «Importar VBF».")
                              } else if (esZip) {
                                  if (extraidos.isEmpty()) {
                                      logConsole("⚠️ Se descargó un ZIP pero no contiene archivos .vbf.")
                                  } else {
                                      logConsole("📦 ZIP descomprimido: ${extraidos.size} archivo(s) .vbf")
                                      extraidos.forEach { logConsole("   • ${it.name} (${it.length() / 1024} KB)") }
                                  }
                              } else if (hayArchivo) {
                                  logConsole("✅ Guardado (${archivoDescargado!!.length()} bytes): ${archivoDescargado.name}")
                              } else {
                                  logConsole("❌ Error al descargar el archivo o respuesta vacía.")
                              }
                              actualizarListaLocal()
                          }
                      }
                  }

                  btnImportar.setOnClickListener {
                      logConsole("📥 Elige un archivo .vbf o .zip de tu teléfono...")
                      selectorArchivo.launch(arrayOf("*/*"))
                  }

                  lvLocalFiles.setOnItemLongClickListener { _, _, position, _ ->
                      val archivos = downloader.listarCalibracionesLocales()
                      if (position in archivos.indices) {
                          val f = archivos[position]
                          if (f.delete()) {
                              if (archivoSeleccionado?.name == f.name) archivoSeleccionado = null
                              logConsole("🗑️ Eliminado: ${f.name}")
                              actualizarListaLocal()
                          }
                      }
                      true
                  }

                  btnBuscarVin.setOnClickListener {
                      val vin = etVin.text.toString().trim().uppercase()
                      val error = VinDecoder.validar(vin)
                      if (error != null) {
                          logConsole("⚠️ $error")
                          return@setOnClickListener
                      }
                      logConsole("🔎 VIN $vin")
                      VinDecoder.infoLocal(vin).forEach { logConsole(it) }
                      if (!VinDecoder.digitoControlOk(vin)) {
                          logConsole("   ℹ️ El dígito de control no coincide (es normal en VIN fuera de Norteamérica).")
                      }
                      logConsole("   Consultando base de datos NHTSA...")
                      CoroutineScope(Dispatchers.IO).launch {
                          val datos = try {
                              VinDecoder.decodificar(vin)
                          } catch (e: Exception) {
                              null
                          }
                          withContext(Dispatchers.Main) {
                              if (datos == null) {
                                  logConsole("❌ No se pudo consultar (¿sin internet?). Solo se muestran datos locales.")
                              } else {
                                  val lineas = VinDecoder.formatear(datos)
                                  if (lineas.isEmpty()) {
                                      logConsole("   Sin datos para este VIN en NHTSA.")
                                  } else {
                                      lineas.forEach { logConsole(it) }
                                      ultimoVehiculo = VinDecoder.resumen(datos)
                                  }
                              }
                          }
                      }
                  }

                  btnInfoArchivo.setOnClickListener {
                      val archivo = archivoSeleccionado
                      if (archivo == null) {
                          logConsole("⚠️ Primero toca un archivo de la lista (sección 2).")
                          Toast.makeText(this, "Toca primero un archivo de la lista", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }
                      logConsole("🔍 Leyendo ${archivo.name}...")
                      CoroutineScope(Dispatchers.IO).launch {
                          val lineas = try {
                              LectorVbf.leer(this@MainActivity, archivo)
                          } catch (e: Exception) {
                              listOf("❌ No se pudo leer el archivo: ${e.message}")
                          }
                          withContext(Dispatchers.Main) {
                              lineas.forEach { logConsole(it) }
                              val vehiculo = ultimoVehiculo
                              if (vehiculo != null) {
                                  logConsole("   🚗 Vehículo (último VIN consultado): $vehiculo")
                              }
                          }
                      }
                  }

                  lvLocalFiles.setOnItemClickListener { _, _, position, _ ->
                      val archivos = downloader.listarCalibracionesLocales()
                      if (position in archivos.indices) {
                          archivoSeleccionado = archivos[position]
                          logConsole("📂 Seleccionado: ${archivoSeleccionado?.name}")
                          validarHabilitarFlasheo()
                      }
                  }

                  btnConnectOBD.setOnClickListener {
                      logConsole("🔍 Buscando adaptador OBD2 Bluetooth (ELM327 / OBDLink)...")
                      adaptadorConectado = true
                      btnConnectOBD.text = "OBD Conectado"
                      logConsole("✅ Enlace Bluetooth listo (Fase de sockets pendiente).")
                      validarHabilitarFlasheo()
                  }

                  btnFlashUDS.setOnClickListener {
                      if (archivoSeleccionado == null) return@setOnClickListener

                      logConsole("🚀 Iniciando secuencia UDS para: ${archivoSeleccionado?.name}")
                      logConsole("[1/4] Programming Session (10 02)...")
                      logConsole("[2/4] Security Access (27)...")
                      logConsole("[3/4] Transfer Data (34/36)...")
                      logConsole("✅ Secuencia de prueba completada.")
                      Toast.makeText(this, "Secuencia ejecutada", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun nombreDeUri(uri: Uri): String? {
                  contentResolver.query(uri, null, null, null, null)?.use { c ->
                      val idx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (idx >= 0 && c.moveToFirst()) return c.getString(idx)
                  }
                  return null
              }

              private fun importarArchivo(uri: Uri) {
                  CoroutineScope(Dispatchers.IO).launch {
                      val mensajes = ArrayList<String>()
                      var elegido: File? = null
                      try {
                          val nombreOriginal = (nombreDeUri(uri) ?: "importado_${System.currentTimeMillis()}")
                              .replace(Regex("[\\\\/:*?\"<>|]"), "_")
                          val carpeta = carpetaCalibraciones
                          if (!carpeta.exists()) carpeta.mkdirs()

                          val temporal = File(cacheDir, "importado.tmp")
                          val entrada = contentResolver.openInputStream(uri)
                              ?: throw Exception("No se pudo abrir el archivo")
                          entrada.use { input ->
                              temporal.outputStream().use { output -> input.copyTo(output) }
                          }

                          if (ZipUtil.esZip(temporal)) {
                              val extraidos = ZipUtil.extraerVbf(temporal, carpeta)
                              temporal.delete()
                              if (extraidos.isEmpty()) {
                                  mensajes.add("⚠️ El ZIP no contiene archivos .vbf.")
                              } else {
                                  mensajes.add("📦 ZIP descomprimido: ${extraidos.size} archivo(s) .vbf")
                                  extraidos.forEach { mensajes.add("   • ${it.name} (${it.length() / 1024} KB)") }
                                  elegido = extraidos.first()
                              }
                          } else {
                              var nombre = nombreOriginal
                              if (!nombre.endsWith(".vbf", ignoreCase = true)) nombre += ".vbf"
                              val destino = File(carpeta, nombre)
                              temporal.copyTo(destino, overwrite = true)
                              temporal.delete()
                              mensajes.add("✅ Importado: ${destino.name} (${destino.length()} bytes)")
                              elegido = destino
                          }
                      } catch (e: Exception) {
                          mensajes.add("❌ No se pudo importar: ${e.message}")
                      }

                      val archivoFinal = elegido
                      val lineasInfo = if (archivoFinal != null) {
                          try {
                              LectorVbf.leer(this@MainActivity, archivoFinal)
                          } catch (e: Exception) {
                              listOf("❌ No se pudo leer el archivo: ${e.message}")
                          }
                      } else {
                          emptyList()
                      }

                      withContext(Dispatchers.Main) {
                          mensajes.forEach { logConsole(it) }
                          if (archivoFinal != null) {
                              archivoSeleccionado = archivoFinal
                              actualizarListaLocal()
                              validarHabilitarFlasheo()
                              lineasInfo.forEach { logConsole(it) }
                              val vehiculo = ultimoVehiculo
                              if (vehiculo != null) {
                                  logConsole("   🚗 Vehículo (último VIN consultado): $vehiculo")
                              }
                          }
                      }
                  }
              }

              private fun actualizarListaLocal() {
                  val listaArchivos = downloader.listarCalibracionesLocales()
                  val nombres = listaArchivos.map { "${it.name} (${it.length() / 1024} KB)" }
                  val adapter = ArrayAdapter(this, android.R.layout.simple_list_item_activated_1, nombres)
                  lvLocalFiles.adapter = adapter
                  val seleccionado = archivoSeleccionado
                  if (seleccionado != null) {
                      val i = listaArchivos.indexOfFirst { it.name == seleccionado.name }
                      if (i >= 0) lvLocalFiles.setItemChecked(i, true)
                  }
              }

              private fun validarHabilitarFlasheo() {
                  if (archivoSeleccionado != null && adaptadorConectado) {
                      btnFlashUDS.isEnabled = true
                      logConsole("🟢 Listo para flasheo UDS.")
                  }
              }

              private fun logConsole(mensaje: String) {
                  tvConsole.append("$mensaje\n")
                  svConsole.post { svConsole.fullScroll(View.FOCUS_DOWN) }
              }
          }
          MAZDA_EOF
          mkdir -p "$(dirname app/src/main/java/com/mikarro/mazdavbfflasher/OneDriveDownloader.kt)"
          cat > app/src/main/java/com/mikarro/mazdavbfflasher/OneDriveDownloader.kt <<'MAZDA_EOF'
          package com.mikarro.mazdavbfflasher

          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import java.io.File
          import java.io.FileOutputStream

          class OneDriveDownloader(private val context: Context) {

              private val client = OkHttpClient.Builder()
                  .followRedirects(true)
                  .followSslRedirects(true)
                  .build()

              suspend fun descargarVbf(fileUrl: String, nombreArchivo: String): File? = withContext(Dispatchers.IO) {
                  try {
                      val urlFinal = if (!fileUrl.contains("download=1")) {
                          if (fileUrl.contains("?")) "$fileUrl&download=1" else "$fileUrl?download=1"
                      } else {
                          fileUrl
                      }

                      val request = Request.Builder()
                          .url(urlFinal)
                          .addHeader("User-Agent", "Mozilla/5.0 (Android; Mobile)")
                          .build()

                      val response = client.newCall(request).execute()
                      if (!response.isSuccessful) return@withContext null

                      val carpetaDestino = File(context.filesDir, "CalibrationFiles")
                      if (!carpetaDestino.exists()) {
                          carpetaDestino.mkdirs()
                      }

                      val archivoLocal = File(carpetaDestino, nombreArchivo)
                      
                      response.body?.byteStream()?.use { input ->
                          FileOutputStream(archivoLocal).use { output ->
                              input.copyTo(output)
                          }
                      }
                      
                      return@withContext archivoLocal
                  } catch (e: Exception) {
                      e.printStackTrace()
                      return@withContext null
                  }
              }

              fun listarCalibracionesLocales(): List<File> {
                  val carpetaDestino = File(context.filesDir, "CalibrationFiles")
                  if (!carpetaDestino.exists()) return emptyList()
                  
                  return carpetaDestino.listFiles { _, name -> name.endsWith(".vbf", ignoreCase = true) }?.toList() ?: emptyList()
              }
          }
          MAZDA_EOF
          mkdir -p "$(dirname app/src/main/java/com/mikarro/mazdavbfflasher/VinDecoder.kt)"
          cat > app/src/main/java/com/mikarro/mazdavbfflasher/VinDecoder.kt <<'MAZDA_EOF'
          package com.mikarro.mazdavbfflasher

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject

          object VinDecoder {

              private val client = OkHttpClient()

              private val etiquetas = listOf(
                  "Make" to "Marca",
                  "Model" to "Modelo",
                  "Model Year" to "Año",
                  "Trim" to "Versión",
                  "Body Class" to "Carrocería",
                  "Engine Model" to "Motor",
                  "Displacement (L)" to "Cilindrada (L)",
                  "Engine Number of Cylinders" to "Cilindros",
                  "Fuel Type - Primary" to "Combustible",
                  "Transmission Style" to "Transmisión",
                  "Drive Type" to "Tracción",
                  "Plant Country" to "País de planta",
                  "Plant City" to "Ciudad de planta"
              )

              fun validar(vin: String): String? {
                  if (vin.length != 17) return "El VIN debe tener 17 caracteres (tiene ${vin.length})."
                  val caracteresValidos = vin.all { it in 'A'..'Z' || it in '0'..'9' }
                  if (!caracteresValidos || vin.any { it == 'I' || it == 'O' || it == 'Q' }) {
                      return "VIN inválido: no puede tener I, O, Q ni símbolos."
                  }
                  return null
              }

              private fun valor(c: Char): Int = when (c) {
                  in '0'..'9' -> c - '0'
                  'A', 'J' -> 1
                  'B', 'K', 'S' -> 2
                  'C', 'L', 'T' -> 3
                  'D', 'M', 'U' -> 4
                  'E', 'N', 'V' -> 5
                  'F', 'W' -> 6
                  'G', 'P', 'X' -> 7
                  'H', 'Y' -> 8
                  'R', 'Z' -> 9
                  else -> 0
              }

              fun digitoControlOk(vin: String): Boolean {
                  val pesos = intArrayOf(8, 7, 6, 5, 4, 3, 2, 10, 0, 9, 8, 7, 6, 5, 4, 3, 2)
                  var suma = 0
                  for (i in 0 until 17) {
                      suma += valor(vin[i]) * pesos[i]
                  }
                  val resto = suma % 11
                  val esperado = if (resto == 10) 'X' else ('0' + resto)
                  return vin[8] == esperado
              }

              fun infoLocal(vin: String): List<String> {
                  val lineas = ArrayList<String>()
                  val wmi = vin.substring(0, 3)
                  val fabricante = when (wmi) {
                      "JM1", "JM3", "JM7", "JMZ" -> "Mazda (Japón)"
                      "3MZ", "3MD" -> "Mazda (México)"
                      "1YV" -> "Mazda (EE.UU., Flat Rock)"
                      "4F2", "4F4" -> "Mazda (EE.UU., vía Ford)"
                      else -> "no identificado localmente ($wmi)"
                  }
                  lineas.add("   Fabricante (WMI): $fabricante")
                  val codigoAnio = "ABCDEFGHJKLMNPRSTVWXY123456789".indexOf(vin[9])
                  if (codigoAnio >= 0) {
                      val anio = if (vin[6].isLetter()) 2010 + codigoAnio else 1980 + codigoAnio
                      lineas.add("   Año modelo (aprox.): $anio")
                  }
                  return lineas
              }

              suspend fun decodificar(vin: String): Map<String, String> = withContext(Dispatchers.IO) {
                  val request = Request.Builder()
                      .url("https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVin/$vin?format=json")
                      .build()
                  val cuerpo = client.newCall(request).execute().use { resp ->
                      if (!resp.isSuccessful) throw Exception("HTTP ${resp.code}")
                      resp.body?.string() ?: throw Exception("Respuesta vacía")
                  }
                  val resultados = JSONObject(cuerpo).getJSONArray("Results")
                  val datos = LinkedHashMap<String, String>()
                  for (i in 0 until resultados.length()) {
                      val o = resultados.getJSONObject(i)
                      val v = o.optString("Value", "").trim()
                      if (v.isNotEmpty() && v != "null") {
                          datos[o.getString("Variable")] = v
                      }
                  }
                  datos
              }

              fun formatear(datos: Map<String, String>): List<String> {
                  val lineas = ArrayList<String>()
                  for ((clave, etiqueta) in etiquetas) {
                      val v = datos[clave]
                      if (v != null) lineas.add("   $etiqueta: $v")
                  }
                  return lineas
              }

              fun resumen(datos: Map<String, String>): String? {
                  val partes = listOfNotNull(datos["Make"], datos["Model"], datos["Model Year"])
                  return if (partes.isEmpty()) null else partes.joinToString(" ")
              }
          }
          MAZDA_EOF
          mkdir -p "$(dirname app/src/main/java/com/mikarro/mazdavbfflasher/VbfParser.kt)"
          cat > app/src/main/java/com/mikarro/mazdavbfflasher/VbfParser.kt <<'MAZDA_EOF'
          package com.mikarro.mazdavbfflasher

          import java.io.File

          object VbfParser {

              private fun moduloPorDireccion(valor: String): String {
                  val limpio = valor.trim().lowercase().removePrefix("0x")
                  val dir = limpio.toIntOrNull(16) ?: return valor
                  val nombre = when (dir) {
                      0x7E0 -> "PCM / ECM (motor)"
                      0x7E1 -> "TCM (transmisión)"
                      else -> "módulo no identificado"
                  }
                  return "0x${dir.toString(16).uppercase()} → $nombre"
              }

              private fun tipoSoftware(valor: String): String = when (valor.trim().uppercase()) {
                  "SBL" -> "SBL (cargador secundario)"
                  "EXE" -> "EXE (ejecutable)"
                  "DATA" -> "DATA (datos / calibración)"
                  else -> valor.trim()
              }

              fun leer(archivo: File): List<String> {
                  val lineas = ArrayList<String>()
                  val bytes = archivo.inputStream().use { entrada ->
                      val buffer = ByteArray(16384)
                      val n = entrada.read(buffer)
                      if (n <= 0) ByteArray(0) else buffer.copyOf(n)
                  }
                  lineas.add("📄 ${archivo.name} (${archivo.length()} bytes)")
                  val texto = String(bytes, Charsets.ISO_8859_1)

                  if (bytes.size > 1 && bytes[0] == 'P'.code.toByte() && bytes[1] == 'K'.code.toByte()) {
                      lineas.add("❌ Este archivo es un ZIP (se descargó una carpeta completa, no un .vbf).")
                      lineas.add("   Usa un enlace directo a un solo archivo .vbf.")
                      return lineas
                  }

                  if (texto.trimStart().startsWith("<", ignoreCase = true)) {
                      lineas.add("❌ El archivo parece una página web (HTML), no un VBF. El enlace no dio descarga directa.")
                      return lineas
                  }

                  val inicio = Regex("header\\s*\\{", RegexOption.IGNORE_CASE).find(texto)
                  if (inicio == null) {
                      lineas.add("❌ No se encontró el encabezado VBF (archivo incompleto o dañado).")
                      val vista = texto.take(60).replace(Regex("[^\\x20-\\x7E]"), ".")
                      lineas.add("   Inicio del archivo: $vista")
                      return lineas
                  }

                  val abre = inicio.range.last
                  var profundidad = 0
                  var cierra = -1
                  var enTexto = false
                  for (i in abre until texto.length) {
                      val c = texto[i]
                      if (c == '"') enTexto = !enTexto
                      if (enTexto) continue
                      if (c == '{') profundidad++
                      if (c == '}') {
                          profundidad--
                          if (profundidad == 0) {
                              cierra = i
                              break
                          }
                      }
                  }
                  if (cierra < 0) {
                      lineas.add("❌ Encabezado VBF incompleto.")
                      return lineas
                  }

                  val version = Regex("vbf_version\\s*=\\s*([^;]+);").find(texto)?.groupValues?.get(1)?.trim()
                  if (version != null) lineas.add("   Versión VBF: $version")

                  val bloque = texto.substring(abre + 1, cierra)
                  val campos = LinkedHashMap<String, String>()
                  val regexCampo = Regex("(\\w+)\\s*=\\s*([^;]*);", RegexOption.DOT_MATCHES_ALL)
                  for (m in regexCampo.findAll(bloque)) {
                      campos[m.groupValues[1]] = m.groupValues[2].trim()
                  }

                  campos["sw_part_number"]?.let { lineas.add("   Número de parte SW: ${it.replace("\"", "")}") }
                  campos["sw_part_type"]?.let { lineas.add("   Tipo de software: ${tipoSoftware(it)}") }
                  campos["ecu_address"]?.let { lineas.add("   Módulo (dirección ECU): ${moduloPorDireccion(it)}") }
                  campos["network"]?.let { lineas.add("   Red: $it") }
                  campos["frame_format"]?.let { lineas.add("   Formato de trama: $it") }
                  campos["data_format_identifier"]?.let { lineas.add("   Formato de datos: $it") }
                  campos["file_checksum"]?.let { lineas.add("   Checksum del archivo: $it") }

                  campos["erase"]?.let { erase ->
                      val pares = Regex("\\{\\s*(0x[0-9A-Fa-f]+)\\s*,\\s*(0x[0-9A-Fa-f]+)\\s*\\}").findAll(erase).toList()
                      if (pares.isNotEmpty()) {
                          var total = 0L
                          for (p in pares) {
                              total += p.groupValues[2].removePrefix("0x").toLongOrNull(16) ?: 0L
                          }
                          lineas.add("   Regiones de borrado: ${pares.size} (${total / 1024} KB)")
                      }
                  }

                  val conocidos = setOf(
                      "sw_part_number", "sw_part_type", "ecu_address", "network",
                      "frame_format", "data_format_identifier", "file_checksum", "erase"
                  )
                  for ((clave, v) in campos) {
                      if (clave !in conocidos) {
                          val corto = v.replace(Regex("\\s+"), " ").replace("\"", "")
                          lineas.add("   $clave: ${if (corto.length > 80) corto.take(80) + "…" else corto}")
                      }
                  }
                  return lineas
              }
          }
          MAZDA_EOF
          mkdir -p "$(dirname app/src/main/java/com/mikarro/mazdavbfflasher/ZipUtil.kt)"
          cat > app/src/main/java/com/mikarro/mazdavbfflasher/ZipUtil.kt <<'MAZDA_EOF'
          package com.mikarro.mazdavbfflasher

          import java.io.File
          import java.io.FileOutputStream
          import java.util.zip.ZipInputStream

          object ZipUtil {

              fun esZip(archivo: File): Boolean {
                  if (!archivo.exists() || archivo.length() < 4) return false
                  return archivo.inputStream().use { entrada ->
                      val a = entrada.read()
                      val b = entrada.read()
                      a == 'P'.code && b == 'K'.code
                  }
              }

              /** Extrae solo los archivos .vbf del ZIP (aplana carpetas) y devuelve los archivos creados. */
              fun extraerVbf(zip: File, destino: File): List<File> {
                  if (!destino.exists()) destino.mkdirs()
                  val extraidos = ArrayList<File>()
                  ZipInputStream(zip.inputStream().buffered()).use { zis ->
                      var entrada = zis.nextEntry
                      while (entrada != null) {
                          if (!entrada.isDirectory) {
                              val nombre = File(entrada.name).name
                              if (nombre.endsWith(".vbf", ignoreCase = true)) {
                                  val salida = File(destino, nombre)
                                  FileOutputStream(salida).use { out -> zis.copyTo(out) }
                                  extraidos.add(salida)
                              }
                          }
                          zis.closeEntry()
                          entrada = zis.nextEntry
                      }
                  }
                  return extraidos
              }
          }
          MAZDA_EOF
          mkdir -p "$(dirname app/src/main/java/com/mikarro/mazdavbfflasher/LectorVbf.kt)"
          cat > app/src/main/java/com/mikarro/mazdavbfflasher/LectorVbf.kt <<'MAZDA_EOF'
          package com.mikarro.mazdavbfflasher

          import android.content.Context
          import com.chaquo.python.Python
          import com.chaquo.python.android.AndroidPlatform
          import java.io.File

          object LectorVbf {

              /** Lee el VBF con el script Python (vbf_reader.py); si Python falla, usa el lector Kotlin. */
              fun leer(contexto: Context, archivo: File): List<String> {
                  return try {
                      if (!Python.isStarted()) {
                          Python.start(AndroidPlatform(contexto.applicationContext))
                      }
                      val modulo = Python.getInstance().getModule("vbf_reader")
                      val resultado = modulo.callAttr("leer_vbf", archivo.absolutePath)
                      val lineas = resultado.asList().map { it.toString() }
                      listOf("🐍 Leído con Python") + lineas
                  } catch (e: Throwable) {
                      listOf("⚠️ Python no disponible (${e.message}). Usando lector Kotlin.") + VbfParser.leer(archivo)
                  }
              }
          }
          MAZDA_EOF
          mkdir -p "$(dirname app/src/main/python/vbf_reader.py)"
          cat > app/src/main/python/vbf_reader.py <<'MAZDA_EOF'
          # -*- coding: utf-8 -*-
          """Lector de archivos VBF (Mazda/Ford) para la app Mazda Calibration Files Android."""
          import hashlib
          import os
          import re
          import zlib

          MODULOS = {0x7E0: "PCM / ECM (motor)", 0x7E1: "TCM (transmisión)"}
          TIPOS = {
              "SBL": "SBL (cargador secundario)",
              "EXE": "EXE (ejecutable)",
              "DATA": "DATA (datos / calibración)",
          }
          CONOCIDOS = (
              "sw_part_number", "sw_part_type", "ecu_address", "network",
              "frame_format", "data_format_identifier", "file_checksum", "erase",
          )


          def _modulo(valor):
              limpio = valor.strip().lower()
              if limpio.startswith("0x"):
                  limpio = limpio[2:]
              try:
                  direccion = int(limpio, 16)
              except ValueError:
                  return valor
              return "0x%X → %s" % (direccion, MODULOS.get(direccion, "módulo no identificado"))


          def _cierre_encabezado(texto, abre):
              profundidad = 0
              en_texto = False
              for i in range(abre, len(texto)):
                  c = texto[i]
                  if c == '"':
                      en_texto = not en_texto
                  if en_texto:
                      continue
                  if c == "{":
                      profundidad += 1
                  elif c == "}":
                      profundidad -= 1
                      if profundidad == 0:
                          return i
              return -1


          def _bloques(datos, pos):
              """Recorre bloques [dirección 4B][largo 4B][datos][CRC 2B]; None si no cuadran."""
              bloques = []
              total = len(datos)
              while pos < total:
                  if pos + 8 > total:
                      return None
                  inicio = int.from_bytes(datos[pos:pos + 4], "big")
                  largo = int.from_bytes(datos[pos + 4:pos + 8], "big")
                  fin = pos + 8 + largo + 2
                  if largo == 0 or fin > total:
                      return None
                  bloques.append((inicio, largo))
                  pos = fin
              return bloques or None


          def leer_vbf(ruta):
              lineas = []
              with open(ruta, "rb") as f:
                  datos = f.read()
              lineas.append("📄 %s (%d bytes)" % (os.path.basename(ruta), len(datos)))

              if datos[:2] == b"PK":
                  lineas.append("❌ Este archivo es un ZIP, no un .vbf.")
                  return lineas
              if datos.lstrip()[:1] == b"<":
                  lineas.append("❌ El archivo parece una página web (HTML), no un VBF.")
                  return lineas

              texto = datos[:65536].decode("latin-1")
              inicio = re.search(r"header\s*\{", texto, re.IGNORECASE)
              if inicio is None:
                  vista = re.sub(r"[^\x20-\x7E]", ".", texto[:60])
                  lineas.append("❌ No se encontró el encabezado VBF (archivo incompleto o dañado).")
                  lineas.append("   Inicio del archivo: %s" % vista)
                  return lineas

              abre = inicio.end() - 1
              cierra = _cierre_encabezado(texto, abre)
              if cierra < 0:
                  lineas.append("❌ Encabezado VBF incompleto.")
                  return lineas

              version = re.search(r"vbf_version\s*=\s*([^;]+);", texto)
              if version:
                  lineas.append("   Versión VBF: %s" % version.group(1).strip())

              bloque = texto[abre + 1:cierra]
              campos = {}
              for m in re.finditer(r"(\w+)\s*=\s*([^;]*);", bloque, re.DOTALL):
                  campos[m.group(1)] = m.group(2).strip()

              if "sw_part_number" in campos:
                  lineas.append("   Número de parte SW: %s" % campos["sw_part_number"].replace('"', ""))
              if "sw_part_type" in campos:
                  tipo = campos["sw_part_type"]
                  lineas.append("   Tipo de software: %s" % TIPOS.get(tipo.strip().upper(), tipo.strip()))
              if "ecu_address" in campos:
                  lineas.append("   Módulo (dirección ECU): %s" % _modulo(campos["ecu_address"]))
              if "network" in campos:
                  lineas.append("   Red: %s" % campos["network"])
              if "frame_format" in campos:
                  lineas.append("   Formato de trama: %s" % campos["frame_format"])
              if "data_format_identifier" in campos:
                  lineas.append("   Formato de datos: %s" % campos["data_format_identifier"])
              if "file_checksum" in campos:
                  lineas.append("   Checksum del archivo: %s" % campos["file_checksum"])

              if "erase" in campos:
                  pares = re.findall(
                      r"\{\s*(0x[0-9A-Fa-f]+)\s*,\s*(0x[0-9A-Fa-f]+)\s*\}", campos["erase"])
                  if pares:
                      total = sum(int(largo, 16) for _, largo in pares)
                      lineas.append("   Regiones de borrado: %d (%d KB)" % (len(pares), total // 1024))

              pos = cierra + 1
              for salto in range(0, 3):
                  bloques = _bloques(datos, pos + salto)
                  if bloques:
                      peso = sum(largo for _, largo in bloques)
                      menor = min(inicio for inicio, _ in bloques)
                      mayor = max(inicio + largo - 1 for inicio, largo in bloques)
                      lineas.append("   Bloques de datos: %d (%d KB)" % (len(bloques), peso // 1024))
                      lineas.append("   Rango de memoria: 0x%X – 0x%X" % (menor, mayor))
                      break

              lineas.append("   CRC32 del archivo: 0x%08X" % (zlib.crc32(datos) & 0xFFFFFFFF))
              lineas.append("   SHA-256: %s…" % hashlib.sha256(datos).hexdigest()[:16])

              for clave, valor in campos.items():
                  if clave not in CONOCIDOS:
                      corto = re.sub(r"\s+", " ", valor).replace('"', "")
                      lineas.append("   %s: %s" % (clave, corto[:80] + ("…" if len(corto) > 80 else "")))
              return lineas
          MAZDA_EOF

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MazdaVBFFlasher-Debug
        path: app/build/outputs/apk/debug/*.apk
